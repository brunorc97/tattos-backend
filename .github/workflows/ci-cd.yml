name: TattOS CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ────────────────────────────────────────────────────
  # Job 1: Build, Test & Security Scan
  # ────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Conceder permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar projeto
        run: ./gradlew compileJava --no-daemon

      - name: Executar testes unitários
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publicar relatório de testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: OWASP Dependency-Check (análise de vulnerabilidades)
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true   # não bloqueia o build; gera relatório

      - name: Upload relatório OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 14

      - name: Build JAR (sem testes)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: tattos-backend-jar
          path: build/libs/*.jar
          retention-days: 7

  # ────────────────────────────────────────────────────
  # Job 2: Build & Push imagem Docker (somente na main)
  # ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/tattos-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build e push da imagem (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
