server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: WARN
    org.hibernate.orm.jdbc.error: WARN
    org.apache.pdfbox: WARN
    org.apache.fontbox: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%15.15t] [%X{correlationId:-no-trace}] [%X{user:-anon}] %-40.40logger{39} : %m%n"

spring:
  application:
    name: tattos-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tattos_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history_tattos

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
