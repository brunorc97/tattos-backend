services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64   # nativo para Apple Silicon (M1/M2/M3)
    container_name: tattos-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-tattos_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-minha-chave-secreta-super-segura-para-jwt-tattos-2026-com-no-minimo-32-caracteres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tattos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.4
    platform: linux/arm64   # nativo para Apple Silicon
    container_name: tattos-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-tattos_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tattos-network

volumes:
  mysql_data:
    driver: local

networks:
  tattos-network:
    driver: bridge
