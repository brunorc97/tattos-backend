spring:
  datasource:
    url: jdbc:h2:mem:tattos_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never

app:
  security:
    jwt-secret: tattos-test-secret-key-must-be-at-least-32-characters-long
    jwt-expiration: 86400000

email:
  enabled: false

logging:
  level:
    root: WARN
    com.tattos: INFO
